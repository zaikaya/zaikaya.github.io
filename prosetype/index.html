<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosetype</title>
    <link rel="canonical" href="https://zaikaya.com/prosetype/">
    <style>
        :root { --bg:#F4F1EA; --fg:#1d1d1b; --dim:#6b6a63; --rule:#cfcabd; }
        @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ece8da; --dim:#9a978b; --rule:#33322e; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--fg); font: 16px/1.7 ui-monospace, "SF Mono", Menlo, "Courier New", monospace; max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.5rem; }
        h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .5rem; }
        h2 { font-size: 1rem; font-weight: 700; margin: 2rem 0 .5rem; }
        .updated { color: var(--dim); margin-bottom: 1.5rem; }
        p { margin-bottom: .75rem; }
        ul { margin: .5rem 0 .75rem 1.5rem; }
        li { margin-bottom: .25rem; }
        a { color: var(--fg); }
        hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
    </style>
</head>
<body>
    <h1>Prosetype</h1>

    <p>A typewriter-style journal. Everything stays on your device.</p>
    <p><a href="privacy/">Privacy Policy</a> · <a href="terms/">Terms &amp; Conditions</a></p>
    <p>Support: <a href="mailto:support@zaikaya.com">support@zaikaya.com</a></p>
</body>
</html>
